name: Deploy to Aliyun

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build frontend
        run: |
          npm ci
          VITE_API_BASE=/api npx vite build

      - name: Pack artifacts
        run: |
          ls -la dist/index.html server/index.js
          tar --exclude='server/node_modules' --exclude='server/.env' -czf deploy.tar.gz dist server
          ls -lh deploy.tar.gz

      - name: Upload tarball
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/tmp"

      - name: Extract & restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          script: |
            mkdir -p /var/www/first-ancient
            cd /var/www/first-ancient
            # 保留服务器上的 .env（tar 里不含 .env，解压后还原）
            [ -f server/.env ] && cp server/.env /tmp/.env.bak
            tar -xzf /tmp/deploy.tar.gz -C /var/www/first-ancient
            [ -f /tmp/.env.bak ] && cp /tmp/.env.bak server/.env
            rm -f /tmp/deploy.tar.gz /tmp/.env.bak
            cd server
            npm ci --registry=https://registry.npmmirror.com
            pm2 restart course-api || pm2 start index.js --name course-api
            pm2 save
