name: Deploy to Aliyun

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build frontend
        run: |
          npm ci
          VITE_API_BASE=/api npx vite build
          ls -la dist/index.html

      - name: Install backend dependencies
        run: |
          cd server
          npm ci

      - name: Setup SSH key
        env:
          SSH_KEY_B64: ${{ secrets.ALIYUN_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.ALIYUN_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Rsync deploy
        env:
          DEPLOY_HOST: ${{ secrets.ALIYUN_HOST }}
        run: |
          set -e
          SSH_OPTS="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no"
          # 前端静态产物
          rsync -avz --delete \
            --exclude '.env' --exclude '.env.local' \
            -e "$SSH_OPTS" \
            dist/ root@${DEPLOY_HOST}:/var/www/first-ancient/dist/
          # 后端代码 + node_modules（runner 上装好，服务器免装依赖）
          rsync -avz --delete \
            --exclude '.env' --exclude '.env.local' \
            -e "$SSH_OPTS" \
            server/ root@${DEPLOY_HOST}:/var/www/first-ancient/server/

      - name: Restart pm2
        env:
          DEPLOY_HOST: ${{ secrets.ALIYUN_HOST }}
          DEPLOY_USER: ${{ secrets.ALIYUN_USER }}
        run: |
          set -e
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} << 'REMOTE'
            set -e
            cd /var/www/first-ancient/server
            # pm2 全局 bin 可能不在非交互 shell 的 PATH，用绝对路径兜底
            PM2_BIN="$(npm config get prefix)/bin/pm2"
            [ -x "$PM2_BIN" ] || PM2_BIN="pm2"
            "$PM2_BIN" restart course-api || "$PM2_BIN" start index.js --name course-api
            "$PM2_BIN" save
          REMOTE
